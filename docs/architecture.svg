<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">GestureScreen system architecture</title>
  <desc id="desc">OV2640 camera frames flow through RGB565 buffering, preprocessing, a six-class MobileNetV1 model, a temporal decision gate, and the LCD reader. A separate board stream feeds Gesture Studio. Private recordings support supervised model training and are not published.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="accent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1440" height="780" fill="#f7fafc"/>
  <rect x="0" y="0" width="1440" height="12" fill="#0d9488"/>
  <text x="64" y="65" fill="#0f172a" font-family="Arial, sans-serif" font-size="35" font-weight="700">GestureScreen</text>
  <text x="64" y="99" fill="#475569" font-family="Arial, sans-serif" font-size="19">Offline gesture-controlled reader · EmbedFire STM32F429IGT6 Challenger V1</text>

  <text x="64" y="149" fill="#0d9488" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ON-DEVICE RUNTIME</text>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M264 274 H281"/>
    <path d="M486 274 H503"/>
    <path d="M708 274 H725"/>
    <path d="M930 274 H947"/>
    <path d="M1152 274 H1169"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="64" y="171" width="200" height="9" rx="4" fill="#38bdf8"/>
    <text x="84" y="211" fill="#0284c7" font-size="15" font-weight="700">01 · SENSOR</text>
    <text x="84" y="250" fill="#0f172a" font-size="22" font-weight="700">OV2640</text>
    <text x="84" y="279" fill="#0f172a" font-size="22" font-weight="700">camera</text>
    <text x="84" y="319" fill="#475569" font-size="16">DCMI + DMA</text>
    <text x="84" y="344" fill="#475569" font-size="16">RGB565 frames</text>

    <rect x="286" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="286" y="171" width="200" height="9" rx="4" fill="#38bdf8"/>
    <text x="306" y="211" fill="#0284c7" font-size="15" font-weight="700">02 · FRAME DATA</text>
    <text x="306" y="250" fill="#0f172a" font-size="22" font-weight="700">Buffer</text>
    <text x="306" y="279" fill="#0f172a" font-size="22" font-weight="700">ownership</text>
    <text x="306" y="319" fill="#475569" font-size="16">SDRAM frame pool</text>
    <text x="306" y="344" fill="#475569" font-size="16">Capture / vision tasks</text>

    <rect x="508" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="508" y="171" width="200" height="9" rx="4" fill="#2dd4bf"/>
    <text x="528" y="211" fill="#0d9488" font-size="15" font-weight="700">03 · PREPROCESS</text>
    <text x="528" y="250" fill="#0f172a" font-size="22" font-weight="700">Crop + resize</text>
    <text x="528" y="289" fill="#475569" font-size="16">192 × 192 center ROI</text>
    <text x="528" y="319" fill="#475569" font-size="16">96 × 96 RGB</text>
    <text x="528" y="344" fill="#475569" font-size="16">int8 input</text>

    <rect x="730" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="730" y="171" width="200" height="9" rx="4" fill="#2dd4bf"/>
    <text x="750" y="211" fill="#0d9488" font-size="15" font-weight="700">04 · INFERENCE</text>
    <text x="750" y="250" fill="#0f172a" font-size="22" font-weight="700">MobileNetV1</text>
    <text x="750" y="279" fill="#0f172a" font-size="22" font-weight="700">0.25× / 96 RGB</text>
    <text x="750" y="319" fill="#475569" font-size="16">STM32Cube.AI</text>
    <text x="750" y="344" fill="#475569" font-size="16">6 classes · int8</text>

    <rect x="952" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="952" y="171" width="200" height="9" rx="4" fill="#f59e0b"/>
    <text x="972" y="211" fill="#b45309" font-size="15" font-weight="700">05 · DECISION</text>
    <text x="972" y="250" fill="#0f172a" font-size="22" font-weight="700">Gesture gate</text>
    <text x="972" y="289" fill="#475569" font-size="16">Score ≥ 90%</text>
    <text x="972" y="319" fill="#475569" font-size="16">Margin ≥ 20%</text>
    <text x="972" y="344" fill="#475569" font-size="16">400 ms / 3 frames</text>

    <rect x="1174" y="171" width="200" height="206" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1174" y="171" width="200" height="9" rx="4" fill="#f59e0b"/>
    <text x="1194" y="211" fill="#b45309" font-size="15" font-weight="700">06 · EXPERIENCE</text>
    <text x="1194" y="250" fill="#0f172a" font-size="22" font-weight="700">Reader UI</text>
    <text x="1194" y="289" fill="#475569" font-size="16">Bookshelf / pages</text>
    <text x="1194" y="319" fill="#475569" font-size="16">Gesture actions</text>
    <text x="1194" y="344" fill="#475569" font-size="16">800 × 480 LCD</text>
  </g>

  <rect x="64" y="398" width="1310" height="45" rx="10" fill="#e0f2f1"/>
  <text x="82" y="427" fill="#115e59" font-family="Arial, sans-serif" font-size="17" font-weight="600">The camera-to-reader path runs entirely on the board without cloud inference.</text>

  <text x="64" y="487" fill="#0d9488" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CAPTURE AND MODEL PREPARATION</text>

  <rect x="64" y="507" width="620" height="183" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="543" fill="#0f172a" font-family="Arial, sans-serif" font-size="21" font-weight="700">Live capture and review</text>
  <path d="M241 613 H269 M440 613 H468" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#accent-arrow)"/>
  <rect x="86" y="575" width="155" height="75" rx="10" fill="#eff6ff"/>
  <text x="102" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Board stream</text>
  <text x="102" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">Camera frames</text>
  <rect x="269" y="575" width="171" height="75" rx="10" fill="#eff6ff"/>
  <text x="285" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">USB CDC</text>
  <text x="285" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">or Ethernet</text>
  <rect x="468" y="575" width="192" height="75" rx="10" fill="#eff6ff"/>
  <text x="484" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Gesture Studio</text>
  <text x="484" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">Windows capture tool</text>
  <text x="86" y="675" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Preview · record · review; recordings stay with their owner.</text>

  <rect x="710" y="507" width="664" height="183" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="732" y="543" fill="#0f172a" font-family="Arial, sans-serif" font-size="21" font-weight="700">Offline supervised model preparation</text>
  <path d="M926 613 H947 M1152 613 H1173" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#accent-arrow)"/>
  <rect x="732" y="575" width="194" height="75" rx="10" fill="#f0fdfa"/>
  <text x="748" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Private recordings</text>
  <text x="748" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">Owner-recorded data</text>
  <rect x="947" y="575" width="205" height="75" rx="10" fill="#f0fdfa"/>
  <text x="963" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Supervised training</text>
  <text x="963" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">No teacher model used</text>
  <rect x="1173" y="575" width="179" height="75" rx="10" fill="#f0fdfa"/>
  <text x="1189" y="608" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Final int8 model</text>
  <text x="1189" y="633" fill="#475569" font-family="Arial, sans-serif" font-size="14">Deployed on board</text>
  <text x="732" y="675" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Training data is private; the model artifacts are published.</text>

  <rect x="64" y="716" width="1310" height="42" rx="10" fill="#fff7ed"/>
  <text x="82" y="743" fill="#9a3412" font-family="Arial, sans-serif" font-size="16" font-weight="600">Privacy boundary: no dataset, raw frames, recording sessions, or per-frame labels are included in the public repository.</text>
</svg>

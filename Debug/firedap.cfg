# Challenger V1 / STM32F429IGT6, CMSIS-DAP, SWD. No external Flash writer.
source [find interface/cmsis-dap.cfg]
transport select swd
if {[info exists GS_DAP_SERIAL]} { adapter serial $GS_DAP_SERIAL }
if {![info exists GS_SWD_KHZ]} { set GS_SWD_KHZ 1000 }
adapter speed $GS_SWD_KHZ
set CLOCK_FREQ $GS_SWD_KHZ
set STOP_WATCHDOG 1
if {[info exists GS_UNDER_RESET] && $GS_UNDER_RESET} { set CONNECT_UNDER_RESET 1 }
set CHIPNAME gesture_f429
set WORKAREASIZE 0x8000
source [find target/stm32f4x.cfg]
# The bundled ST target script otherwise installs a reset-init hook that writes
# an HSI PLL profile. Keep firmware's .ioc as the clock source during bring-up.
$_TARGETNAME configure -event reset-init {
    global GS_SWD_KHZ
    adapter speed $GS_SWD_KHZ
}
reset_config srst_only srst_nogate
if {[info exists GS_UNDER_RESET] && $GS_UNDER_RESET} {
    reset_config srst_only srst_nogate connect_assert_srst
}
# In the actual debug session, freeze IWDG while the CPU is halted.
$_TARGETNAME configure -event halted {
    mmw 0xE0042008 0x00001000 0
}
bindto 127.0.0.1

proc gs_verify_chip {} {
    set device [expr {[lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF}]
    set kib [lindex [read_memory 0x1FFF7A22 16 1] 0]
    if {$device != 0x419 || $kib != 1024} {
        error "Unexpected target: device ID $device, internal Flash $kib KiB; expected F42x/F43x with 1024 KiB"
    }
}
